<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Trainchecker – free train delays and disruption checker</title>
    <meta name="description" content="Free live train delays between any two stations in Great Britain, in plain English: the next four hours, platforms, the last week and engineering work." />
    <link rel="canonical" href="https://trainchecker.baish.net/" />
    <!-- Search (stage 5, John's wording, November 18th 2026; SEO-HANDOVER.md): the <title> and
         the search description above are for search engines; the og:/twitter: tags below are for
         link previews, in the words drawn into the preview picture (John, November 18th 2026). The canonical link names the one main address.
         JourneyView.tsx sets the tab's title for a journey and puts this one back afterwards:
         keep the two the same. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trainchecker" />
    <meta property="og:description" content="Check how the trains are doing, with gentle, natural-sounding answers and a fragment of inspiration." />
    <meta property="og:image" content="https://trainchecker.baish.net/og-trainchecker.png" />
    <meta property="og:url" content="https://trainchecker.baish.net/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trainchecker" />
    <meta name="twitter:description" content="Check how the trains are doing, with gentle, natural-sounding answers and a fragment of inspiration." />
    <meta name="twitter:image" content="https://trainchecker.baish.net/og-trainchecker.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Home Screen (John, November 27th 2026, option A): iPhones don't use the SVG favicon, so
         "Add to Home Screen" needs this 180 by 180 picture (made by design/home-icon/icons.mjs), and
         the short name, or it offers the whole <title> above. The manifest (trial, November 27th 2026) gives
         the name again and asks for the site's front page, not the journey on screen, as the start. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Trainchecker" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Dark mode: set before the page draws, so there's no flash of the wrong colours. A
         choice kept by the switch wins; otherwise the device's own setting (house style §2).
         The same key and rule as src/lib/theme.ts. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('trainchecker.theme') } catch (e) {}
        var device = false
        try { device = window.matchMedia('(prefers-color-scheme: dark)').matches } catch (e) {}
        if (t === 'dark' || (t !== 'light' && device)) document.documentElement.dataset.theme = 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
